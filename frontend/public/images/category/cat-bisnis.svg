<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-bisnis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow-bisnis" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-bisnis)" filter="url(#shadow-bisnis)" />

  <!-- Bar Chart Base -->
  <rect x="28" y="68" width="12" height="20" rx="4" fill="#6ee7b7" opacity="0.9" />
  <rect x="46" y="56" width="12" height="32" rx="4" fill="#a7f3d0" />
  <rect x="64" y="44" width="12" height="44" rx="4" fill="#ffffff" />
  <rect x="82" y="32" width="12" height="56" rx="4" fill="url(#gold-coin)" />

  <!-- Trending Arrow -->
  <path d="M 28 62 L 48 48 L 66 52 L 88 28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 76 28 L 88 28 L 88 40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Golden Currency Coin Badge -->
  <g transform="translate(30, 24)">
    <circle cx="14" cy="14" r="14" fill="url(#gold-coin)" />
    <circle cx="14" cy="14" r="11" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="2 2" />
    <!-- Dollar / Rupiah Currency Symbol -->
    <text x="14" y="19" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#854d0e">$</text>
  </g>
</svg>
