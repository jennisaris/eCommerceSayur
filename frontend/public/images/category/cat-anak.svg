<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-anak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rocket-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow-anak" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-anak)" filter="url(#shadow-anak)" />

  <!-- Stars & Moon in background -->
  <path d="M 32 30 C 35 30 38 27 38 24 C 38 27 41 30 44 30 C 41 30 38 33 38 36 C 38 33 35 30 32 30 Z" fill="#fde047" />
  <circle cx="86" cy="74" r="7" fill="#fef08a" opacity="0.8" />
  <ellipse cx="86" cy="74" rx="11" ry="3" stroke="#fef08a" stroke-width="1.5" transform="rotate(-20 86 74)" fill="none" opacity="0.9" />

  <!-- Playful Flying Space Rocket -->
  <g transform="translate(42, 28) rotate(40)">
    <!-- Rocket Wings -->
    <path d="M 6 36 L -2 46 L 8 44 Z" fill="#ef4444" />
    <path d="M 22 36 L 30 46 L 20 44 Z" fill="#ef4444" />

    <!-- Rocket Body -->
    <path d="M 14 6 C 24 16 24 38 22 42 L 6 42 C 4 38 4 16 14 6 Z" fill="url(#rocket-body)" stroke="#0284c7" stroke-width="1.5" />
    <!-- Rocket Nosecone -->
    <path d="M 14 6 C 18 10 21 15 21 18 L 7 18 C 7 15 10 10 14 6 Z" fill="#ef4444" />
    <!-- Porothole Window -->
    <circle cx="14" cy="27" r="4.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="15.5" cy="25.5" r="1.5" fill="#ffffff" />

    <!-- Rocket Fire Thruster -->
    <polygon points="10,42 14,54 18,42 16,45 12,45" fill="#f59e0b" />
    <polygon points="12,42 14,49 16,42" fill="#fde047" />
  </g>

  <!-- Open Kids Book Platform at bottom -->
  <path d="M 60 88 C 48 83 34 83 26 86 L 26 78 C 34 75 48 75 60 80 Z" fill="#ffffff" />
  <path d="M 60 88 C 72 83 86 83 94 86 L 94 78 C 86 75 72 75 60 80 Z" fill="#f8fafc" />
  <path d="M 60 80 L 60 89" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
</svg>
