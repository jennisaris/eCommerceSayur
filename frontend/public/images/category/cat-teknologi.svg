<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-tekno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="shadow-tekno" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-tekno)" filter="url(#shadow-tekno)" />

  <!-- Code Terminal / Monitor Window -->
  <rect x="25" y="32" width="70" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Terminal Top Dots -->
  <circle cx="35" cy="40" r="2.5" fill="#ef4444" />
  <circle cx="43" cy="40" r="2.5" fill="#f59e0b" />
  <circle cx="51" cy="40" r="2.5" fill="#10b981" />
  <line x1="25" y1="46" x2="95" y2="46" stroke="#1e293b" stroke-width="1.5" />

  <!-- Code Syntax < / > Symbols -->
  <!-- Left Bracket < -->
  <path d="M 46 54 L 38 61 L 46 68" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center Slash / -->
  <path d="M 63 52 L 57 70" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
  <!-- Right Bracket > -->
  <path d="M 74 54 L 82 61 L 74 68" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monitor Stand -->
  <path d="M 52 84 L 68 84 L 72 92 L 48 92 Z" fill="#334155" />
  <line x1="42" y1="92" x2="78" y2="92" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sparkle Particle -->
  <circle cx="86" cy="24" r="3" fill="#38bdf8" opacity="0.9" />
</svg>
