<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Cheerful Cosmic Gradient -->
    <linearGradient id="bg-dongeng" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="35%" stop-color="#312e81" />
      <stop offset="70%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="spine-dongeng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="4%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="8%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="6" fill="url(#bg-dongeng)" />

  <!-- Twinkling Yellow & White Stars -->
  <g fill="#fef08a">
    <circle cx="45" cy="50" r="3" />
    <circle cx="85" cy="110" r="2" />
    <circle cx="340" cy="80" r="3.5" />
    <circle cx="370" cy="160" r="2" />
    <circle cx="60" cy="220" r="2.5" />
    <circle cx="330" cy="290" r="3" />
    <circle cx="70" cy="420" r="2" />
    <!-- 4-point star -->
    <path d="M 320 40 Q 325 45 330 45 Q 325 45 325 50 Q 325 45 320 45 Z" fill="#ffffff" />
    <path d="M 90 310 Q 95 315 100 315 Q 95 315 95 320 Q 95 315 90 315 Z" fill="#fde047" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(200, 42)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#fbbf24" />
    <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#451a03" letter-spacing="1">BUKU CERITA BERGAMBAR FULL COLOR</text>
  </g>

  <!-- Playful Title -->
  <g transform="translate(200, 110)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#fde047" letter-spacing="3" stroke="#4338ca" stroke-width="4">DONGENG</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#fde047" letter-spacing="3">DONGENG</text>
    
    <text x="0" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="2" stroke="#1e1b4b" stroke-width="4">EDUKASI SAINS</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="2">EDUKASI SAINS</text>

    <!-- Fun "SERU!" Ribbon -->
    <rect x="-50" y="60" width="100" height="28" rx="14" fill="#f43f5e" />
    <text x="0" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">SERU!</text>
  </g>

  <!-- Subtitle -->
  <text x="200" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Rahasia Tata Surya, Hewan, Tumbuhan &amp; Alam Semesta</text>

  <!-- Central Artwork: Cheerful Rocket, Ringed Planet & Open Storybook -->
  <g transform="translate(200, 340)">
    <!-- Cheerful Ringed Saturn Planet -->
    <circle cx="80" cy="-40" r="28" fill="#f59e0b" />
    <ellipse cx="80" cy="-40" rx="42" ry="12" stroke="#fde047" stroke-width="4" fill="none" transform="rotate(-25 80 -40)" />

    <!-- Cute Smiling Earth Planet -->
    <circle cx="-75" cy="10" r="26" fill="#38bdf8" />
    <path d="M -90 10 C -85 -5 -70 -5 -65 15 C -65 25 -80 30 -90 10 Z" fill="#22c55e" />
    <!-- Smiling Eyes on Earth -->
    <circle cx="-80" cy="5" r="2.5" fill="#0f172a" />
    <circle cx="-68" cy="5" r="2.5" fill="#0f172a" />
    <path d="M -77 12 Q -74 18 -71 12" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Flying Red Space Rocket -->
    <g transform="translate(0, -25) rotate(-35)">
      <!-- Fire flame -->
      <polygon points="-6,25 0,42 6,25 3,30 -3,30" fill="#ef4444" />
      <polygon points="-3,25 0,35 3,25" fill="#facc15" />
      <!-- Rocket Body -->
      <path d="M 0 -25 C 16 -10 16 20 14 25 L -14 25 C -16 20 -16 -10 0 -25 Z" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5" />
      <path d="M 0 -25 C 6 -18 10 -10 10 -5 L -10 -5 C -10 -10 -6 -18 0 -25 Z" fill="#ef4444" />
      <circle cx="0" cy="8" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
      <!-- Rocket Fins -->
      <path d="M -14 18 L -24 30 L -12 25 Z" fill="#3b82f6" />
      <path d="M 14 18 L 24 30 L 12 25 Z" fill="#3b82f6" />
    </g>

    <!-- Open Magic Book Base with Glow -->
    <path d="M 0 65 C -40 55 -90 55 -120 62 L -120 85 C -90 78 -40 78 0 88 Z" fill="#ffffff" />
    <path d="M 0 65 C 40 55 90 55 120 62 L 120 85 C 90 78 40 78 0 88 Z" fill="#f8fafc" />
    <line x1="0" y1="65" x2="0" y2="89" stroke="#6366f1" stroke-width="3" />
    <!-- Rainbow light from book -->
    <path d="M -80 60 Q 0 35 80 60" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.6" />
    <path d="M -70 63 Q 0 40 70 63" fill="none" stroke="#eab308" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Author Name -->
  <g transform="translate(200, 480)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fde047" letter-spacing="1.5">TIM EDUKASI CILIK NUSANTARA</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">UNTUK USIA 4 - 10 TAHUN</text>
  </g>

  <!-- Publisher Imprint -->
  <g transform="translate(200, 530)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#e0e7ff" letter-spacing="1">BHUANA ILMU POPULER (BIP) • GRAMEDIA</text>
  </g>

  <!-- 3D Spine Fold -->
  <rect x="0" y="0" width="30" height="560" fill="url(#spine-dongeng)" />
</svg>
