<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-fiksi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow-fiksi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-fiksi)" filter="url(#shadow-fiksi)" />

  <!-- Background decorative sparkle -->
  <circle cx="90" cy="30" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="30" cy="88" r="2" fill="#ffffff" opacity="0.6" />

  <!-- Open Book Illustration -->
  <!-- Left Page -->
  <path d="M 60 76 C 50 72 36 71 28 73 L 28 42 C 36 40 50 41 60 45 Z" fill="#ffffff" />
  <path d="M 60 76 C 50 72 36 71 28 73 L 28 71 C 36 69 50 70 60 74 Z" fill="#e2e8f0" />
  <!-- Left Page Lines -->
  <line x1="34" y1="48" x2="52" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="34" y1="55" x2="52" y2="57" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="34" y1="62" x2="48" y2="64" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Right Page -->
  <path d="M 60 76 C 70 72 84 71 92 73 L 92 42 C 84 40 70 41 60 45 Z" fill="#f8fafc" />
  <path d="M 60 76 C 70 72 84 71 92 73 L 92 71 C 84 69 70 70 60 74 Z" fill="#cbd5e1" />
  <!-- Right Page Lines -->
  <line x1="68" y1="50" x2="86" y2="48" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="57" x2="86" y2="55" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="64" x2="82" y2="62" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Center Book Spine -->
  <path d="M 60 45 L 60 77" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Golden Bookmark Ribbon -->
  <path d="M 60 45 L 60 84 L 56 80 L 52 84 L 52 46 Z" fill="url(#gold-accent)" opacity="0.95" />

  <!-- Elegant Feather Quill -->
  <g transform="translate(68, 20) rotate(24) scale(0.7)">
    <path d="M 12 0 C 22 14 26 36 10 52 C 8 40 10 26 12 0 Z" fill="url(#gold-accent)" />
    <path d="M 12 0 C 2 16 0 34 10 52" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="52" x2="8" y2="62" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
