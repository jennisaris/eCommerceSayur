<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Ocean Abyss Gradient -->
    <linearGradient id="bg-laut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="35%" stop-color="#0c2340" />
      <stop offset="70%" stop-color="#034674" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sea-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="spine-laut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="4%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="8%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="400" height="560" rx="6" fill="url(#bg-laut)" />

  <!-- Rays of sunlight filtering underwater -->
  <polygon points="170,0 230,0 270,300 130,300" fill="url(#sea-light)" />
  <polygon points="120,0 160,0 190,260 90,260" fill="url(#sea-light)" opacity="0.6" />
  <polygon points="240,0 270,0 310,240 220,240" fill="url(#sea-light)" opacity="0.6" />

  <!-- Top Awards Recognition -->
  <g transform="translate(200, 42)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#7dd3fc" letter-spacing="1">PEMENANG S.E.A. WRITE AWARD &amp; KUSALA SASTRA KHATULISTIWA</text>
  </g>

  <!-- Author Name at Top -->
  <g transform="translate(200, 78)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="16" font-weight="700" fill="#e0f2fe" letter-spacing="4">LEILA S. CHUDORI</text>
    <line x1="-60" y1="12" x2="60" y2="12" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- Big Poetic Title -->
  <text x="200" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#ffffff" letter-spacing="6">LAUT</text>
  <text x="200" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#38bdf8" letter-spacing="4">Bercerita</text>

  <!-- Subtitle Quote -->
  <text x="200" y="246" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" fill="#bae6fd" letter-spacing="0.5">"Mati bukanlah kekalahan, melainkan kepulangan abadi ke dasar samudra."</text>

  <!-- Central Submerged Silhouette Artwork (Deep sea, diver / chained figure, bubbles) -->
  <g transform="translate(200, 360)">
    <!-- Sea Waves -->
    <path d="M -160 40 Q -80 15 0 40 T 160 40 L 160 120 L -160 120 Z" fill="#0369a1" opacity="0.7" />
    <path d="M -160 65 Q -80 40 0 65 T 160 65 L 160 120 L -160 120 Z" fill="#0c4a6e" />

    <!-- Submerged Figure Silhouette (Biru Laut) -->
    <path d="M -12 -90 C -4 -100 8 -90 12 -70 C 14 -50 25 -40 25 -25 C 25 -10 10 10 5 45 C -2 30 -5 10 -15 -10 C -25 -25 -18 -45 -15 -65 Z" fill="#021427" opacity="0.95" />
    <!-- Ocean Bubbles -->
    <circle cx="8" cy="-115" r="5" fill="#bae6fd" opacity="0.7" />
    <circle cx="18" cy="-135" r="3.5" fill="#bae6fd" opacity="0.6" />
    <circle cx="6" cy="-155" r="2.5" fill="#bae6fd" opacity="0.5" />
    <circle cx="-16" cy="-100" r="3" fill="#bae6fd" opacity="0.6" />
    <circle cx="26" cy="-80" r="2" fill="#bae6fd" opacity="0.7" />
  </g>

  <!-- Bottom Edition Tag & Publisher -->
  <g transform="translate(200, 508)">
    <rect x="-85" y="-14" width="170" height="24" rx="12" fill="#075985" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="1">EDISI RESMI HARDCOVER</text>
  </g>

  <g transform="translate(200, 538)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#7dd3fc" letter-spacing="1">KEPUSTAKAAN POPULER GRAMEDIA</text>
  </g>

  <!-- 3D Spine Fold -->
  <rect x="0" y="0" width="30" height="560" fill="url(#spine-laut)" />
</svg>
