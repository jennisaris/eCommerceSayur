version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be provided and must be least-privilege}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be provided}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      TZ: Asia/Jakarta
    # Note: Ports are NOT mapped to the host for production security
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be provided} -d ${DB_NAME:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_internal

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis_prod
    restart: always
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru",
      "--requirepass", "${REDIS_PASSWORD:?Redis password must be provided}"
    ]
    # Note: Ports are NOT mapped to the host for production security
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER must be provided and must be least-privilege}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      COOKIE_SECURE: "true"
      REQUIRE_EMAIL_VERIFICATION: "true"
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be provided}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME must be provided}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be provided}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be provided}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL:-https://yourdomain.com}
      RUN_SEEDER: "false"
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY must be provided}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY must be provided}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
    networks:
      - ecommerce_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend_prod
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
      NUXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY must be provided}
      NUXT_PUBLIC_MIDTRANS_SNAP_URL: ${NUXT_PUBLIC_MIDTRANS_SNAP_URL:-https://app.sandbox.midtrans.com/snap/snap.js}
    networks:
      - ecommerce_internal

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx_prod
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL certificates are attached
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ecommerce_internal

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  ecommerce_internal:
    driver: bridge
