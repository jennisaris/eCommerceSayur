<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Terracotta / Sepia Heritage Gradient -->
    <linearGradient id="bg-bumi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="45%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gold-bumi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="spine-bumi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="4%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="8%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="6" fill="url(#bg-bumi)" />

  <!-- Heritage Vintage Batik/Floral Frame Pattern -->
  <rect x="20" y="20" width="360" height="520" rx="4" fill="none" stroke="url(#gold-bumi)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />
  <rect x="25" y="25" width="350" height="510" rx="4" fill="none" stroke="#fef3c7" stroke-width="0.75" opacity="0.4" />

  <!-- Top Series Subtitle -->
  <g transform="translate(200, 52)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="11" font-weight="700" fill="url(#gold-bumi)" letter-spacing="3">TETRALOGI BURU • JILID PERTAMA</text>
    <line x1="-80" y1="12" x2="80" y2="12" stroke="url(#gold-bumi)" stroke-width="1" />
  </g>

  <!-- Author Name (Large Prestige) -->
  <g transform="translate(200, 105)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#ffffff" letter-spacing="2">PRAMOEDYA</text>
    <text x="0" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#fde68a" letter-spacing="3">ANANTA TOER</text>
  </g>

  <!-- Central Title Section -->
  <g transform="translate(200, 195)">
    <rect x="-140" y="-35" width="280" height="80" fill="#291002" rx="6" stroke="url(#gold-bumi)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">BUMI</text>
    <text x="0" y="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="900" fill="url(#gold-bumi)" letter-spacing="5">MANUSIA</text>
  </g>

  <!-- Subtitle Quote -->
  <text x="200" y="268" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#fed7aa" letter-spacing="0.5">"Seorang terpelajar harus sudah berbuat adil sejak dalam pikiran."</text>

  <!-- Historical Silhouette (Minke & Annelies vintage portrait motif) -->
  <g transform="translate(200, 380)">
    <!-- Heritage Medallion -->
    <circle cx="0" cy="0" r="65" fill="#3b1502" stroke="url(#gold-bumi)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#fef3c7" stroke-width="1" stroke-dasharray="4 2" />

    <!-- Javanese Young Scholar Silhouette (Blangkon & Beskap) -->
    <path d="M -22 -10 C -22 -35 -5 -45 0 -45 C 5 -45 22 -35 22 -10 C 22 5 28 20 32 45 L -32 45 C -28 20 -22 5 -22 -10 Z" fill="#1c0a01" />
    <!-- Blangkon Back Tail -->
    <circle cx="16" cy="-28" r="7" fill="#1c0a01" />
    <!-- Golden Quill overlay in medallion -->
    <path d="M -8 18 L 22 -22" stroke="url(#gold-bumi)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Details -->
  <g transform="translate(200, 485)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="url(#gold-bumi)" letter-spacing="1.5">NOMINE NOBEL SASTRA • KARYA AGUNG NUSANTARA</text>
  </g>

  <!-- Publisher Imprint -->
  <g transform="translate(200, 520)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#ffffff" letter-spacing="2">LENTERA DIPANTARA</text>
  </g>

  <!-- 3D Spine Fold -->
  <rect x="0" y="0" width="30" height="560" fill="url(#spine-bumi)" />
</svg>
