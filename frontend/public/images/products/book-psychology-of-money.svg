<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-pom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#183c5c" />
    </linearGradient>
    <linearGradient id="gold-pom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <!-- Spine Shadow -->
    <linearGradient id="spine-pom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="4%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="8%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="6" fill="url(#bg-pom)" />

  <!-- Geometric Subtle Grid Accent -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="560" />
    <line x1="150" y1="0" x2="150" y2="560" />
    <line x1="250" y1="0" x2="250" y2="560" />
    <line x1="350" y1="0" x2="350" y2="560" />
    <line x1="0" y1="140" x2="400" y2="140" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="420" x2="400" y2="420" />
  </g>

  <!-- Top Bestseller Ribbon -->
  <g transform="translate(200, 42)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="url(#gold-pom)" letter-spacing="1.5">INTERNATIONAL BESTSELLER • TERJUAL 4+ JUTA KOPI</text>
  </g>

  <!-- Main Title -->
  <text x="200" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#93c5fd" letter-spacing="4">THE</text>
  <text x="200" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">PSYCHOLOGY</text>
  <text x="200" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#93c5fd" letter-spacing="4">OF</text>
  <text x="200" y="232" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="url(#gold-pom)" letter-spacing="3">MONEY</text>

  <!-- Subtitle -->
  <line x1="130" y1="250" x2="270" y2="250" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="272" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#e0f2fe" letter-spacing="0.5">PELAJARAN ABADI MENGENAI KEKAYAAN,</text>
  <text x="200" y="288" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#e0f2fe" letter-spacing="0.5">KETAMAKAN, DAN KEBAHAGIAAN</text>

  <!-- Central Graphic: Stylized Vault Mind & Rising Wealth Vector -->
  <g transform="translate(140, 316)">
    <!-- Golden Geometric Coin Structure -->
    <circle cx="60" cy="55" r="50" fill="none" stroke="url(#gold-pom)" stroke-width="2" stroke-dasharray="6 3" />
    <circle cx="60" cy="55" r="40" fill="#0f2942" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Vault Dial & Growth Curve -->
    <path d="M 35 70 C 45 45 65 60 85 35" fill="none" stroke="url(#gold-pom)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="85" cy="35" r="4.5" fill="#fde047" />

    <text x="60" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="url(#gold-pom)">$</text>
  </g>

  <!-- Author Name -->
  <g transform="translate(200, 474)">
    <line x1="100" y1="-12" x2="300" y2="-12" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3">MORGAN HOUSEL</text>
  </g>

  <!-- Publisher Imprint -->
  <g transform="translate(200, 528)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#7dd3fc" opacity="0.85" letter-spacing="1">PENERBIT BACA</text>
  </g>

  <!-- Spine 3D Overlay -->
  <rect x="0" y="0" width="30" height="560" fill="url(#spine-pom)" />
</svg>
