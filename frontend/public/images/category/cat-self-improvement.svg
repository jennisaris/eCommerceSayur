<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-self" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="glow-bulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="shadow-self" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-self)" filter="url(#shadow-self)" />

  <!-- Radiance Rays -->
  <line x1="60" y1="22" x2="60" y2="16" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
  <line x1="84" y1="32" x2="89" y2="28" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
  <line x1="94" y1="52" x2="100" y2="52" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
  <line x1="36" y1="32" x2="31" y2="28" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
  <line x1="26" y1="52" x2="20" y2="52" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />

  <!-- Lightbulb Body -->
  <path d="M 60 28 C 47 28 38 37 38 50 C 38 58 44 65 48 70 L 48 78 C 48 80 50 82 52 82 L 68 82 C 70 82 72 80 72 78 L 72 70 C 76 65 82 58 82 50 C 82 37 73 28 60 28 Z" fill="url(#glow-bulb)" />

  <!-- Inner Filament Mind Core -->
  <path d="M 52 52 C 52 46 56 42 60 42 C 64 42 68 46 68 52 C 68 57 63 60 60 64 L 60 70" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bulb Base Metal Screws -->
  <line x1="51" y1="86" x2="69" y2="86" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" />
  <path d="M 54 90 C 56 93 64 93 66 90" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" />

  <!-- Green Growth Sprout at the side -->
  <g transform="translate(68, 64) scale(0.65)">
    <path d="M 4 28 C 4 14 16 2 30 0 C 32 14 20 26 6 28 Z" fill="#22c55e" />
    <path d="M 4 28 C 4 20 0 14 -12 12 C -14 22 -6 30 4 32 Z" fill="#16a34a" />
    <path d="M 4 38 L 4 26" stroke="#15803d" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
