<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bg-manga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow-manga" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#b91c1c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg-manga)" filter="url(#shadow-manga)" />

  <!-- Action Speed Lines / Burst -->
  <path d="M 60 22 L 60 30 M 78 28 L 73 34 M 88 44 L 80 47 M 88 64 L 80 62 M 32 44 L 40 47 M 32 64 L 40 62" stroke="#fecaca" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Comic Bubble Frame -->
  <path d="M 30 36 C 30 30 38 26 50 26 L 76 26 C 88 26 94 32 94 42 L 94 66 C 94 76 86 80 74 80 L 52 80 L 40 92 L 42 80 C 34 78 30 72 30 64 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Japanese Manga Speed Sound Effect (BAM! / POW! / ドン) Stylized Graphic -->
  <g transform="translate(42, 38)">
    <!-- Comic Flash Star -->
    <polygon points="18,4 23,12 32,10 26,17 31,25 21,24 16,32 13,23 4,24 9,17 2,10 11,11" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <!-- Manga Dramatic Lines inside bubble -->
    <line x1="8" y1="20" x2="1" y2="22" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="12" x2="35" y2="10" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <text x="18" y="22" text-anchor="middle" font-family="'Impact', 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#dc2626" letter-spacing="1">MANGA</text>
  </g>
</svg>
